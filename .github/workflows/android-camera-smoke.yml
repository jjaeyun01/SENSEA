name: Android live camera smoke
on:
  push:
    paths: ["mobile/**", ".github/workflows/android-camera-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-smoke-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
jobs:
  camera:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone emulator APK
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm run models:download
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise permission dialog and real native preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: python3 mobile/scripts/android-camera-smoke.py mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-camera-smoke-evidence
          path: build/camera-smoke
          if-no-files-found: warn
          retention-days: 14
